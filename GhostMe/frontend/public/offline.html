<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghost Me · offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090c1e; color: #e8ebfa;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; }
    img { width: 96px; height: 96px; border-radius: 20px; }
    p { color: #a0a8cd; max-width: 360px; }
    button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 12px; color: #fff; font-weight: 600;
             background: linear-gradient(135deg, #7092ff, #b684ff); cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="Logo Ghost Me">
    <h1>Sei offline</h1>
    <p>Il tuo alter ego ha bisogno della connessione al tuo server Ghost Me. I tuoi dati non vengono salvati sul dispositivo.</p>
    <button onclick="location.reload()">Riprova</button>
    <p style="font-size:12px">© Roberto Di Flumeri</p>
  </main>
</body>
</html>
